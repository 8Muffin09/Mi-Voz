name: mi_voz
description: "Mi Voz: comunicación aumentativa con pictogramas para niños con autismo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Firebase
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_storage: ^14.0.0

  # Dispositivo y almacenamiento local
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6

  # Utilidades
  uuid: ^4.6.0
  intl: ^0.20.3
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8

  # Melodía de bienvenida (opcional, desactivada por defecto)
  audioplayers: ^6.8.1

  # Invitaciones: QR (generar y escanear) y validación en Cloud Functions
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  cloud_functions: ^7.0.1
  flutter_svg: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pruebas en el dispositivo (emulador o teléfono)
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generación de iconos y recursos (tool/prepare_brand_assets.dart)
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0
  msix: ^3.18.0

# Icono de instalación a partir de la imagen 2 (branding/imagen2_icono_app.png).
# Regenerar: dart run tool/prepare_brand_assets.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E3F1FF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash_mi_voz.png
    - assets/images/logo_mi_voz.png
    - assets/audio/bienvenida_mi_voz.wav
    # Avatares ilustrados (diseño propio, tool/avatars/generate_avatars.dart)
    - assets/avatars/
    # Pictogramas de ARASAAC (CC BY-NC-SA 4.0, ver assets/pictograms/ATRIBUCION.md)
    - assets/pictograms/

  fonts:
    # Atkinson Hyperlegible (SIL Open Font License 1.1, ver assets/fonts/OFL.txt).
    # Diseñada para máxima legibilidad.
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700

# Paquete MSIX para Microsoft Store (necesita compilar Windows antes):
#   flutter build windows --release && dart run msix:create --build-windows false
# identity_name, publisher y publisher_display_name los asigna el Centro de
# partners de Microsoft al reservar el nombre de la app: cópialos de allí.
# Con store: true el paquete no se firma localmente (lo firma la Store).
msix_config:
  display_name: Mi Voz
  msix_version: 1.0.0.0
  logo_path: assets/icon/app_icon.png
  languages: es-mx
  capabilities: internetClient
  store: true
  # identity_name: <del Centro de partners>
  # publisher: <CN=... del Centro de partners>
  # publisher_display_name: <tu nombre de editor>
